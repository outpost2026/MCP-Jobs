[project]
name = "mcp-jobs"
version = "0.4.0"
description = "MCP server for CZ job portal search — live scraping, boolean matching, EROI analysis"
authors = [
    {name = "Ondřej Soušek", email = "outpost2026@github.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
mcp-jobs = "mcp_jobs.cli:main"

[project.urls]
Source = "https://github.com/outpost2026/MCP-Jobs"
Issues = "https://github.com/outpost2026/MCP-Jobs/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Deterministická lint sada — CI nesmí padat při upgradu ruff (nová
# defaultní pravidla v 0.16+ způsobila CI failure 2026-08-15).
# E4/E7/E9/F = ruff default (stabillní napříč verzemi); UP/RUF/PIE/FURB/DTZ
# = moderní pravidla, která codebase splňuje. E5 (E501) je mimo: SQL/CSS
# řetězce jsou záměrně dlouhé.
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "RUF", "PIE", "FURB", "DTZ"]
# BLE001 (broad except) je ZÁMĚRNÁ graceful degradation scraperů
# (P4: network/parse selhání nesmí shodit celý běh) — viz SESSION_INJECT.
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# E402: scripty dělají sys.path.insert(0, src) před importem mcp_jobs —
# záměrný vzor standalone scriptů (ne moduly).
"scripts/*.py" = ["E402"]
"tests/live_scrapers.py" = ["E402"]
