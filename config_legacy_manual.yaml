# MCP-Jobs fallback configuration — LEGACY / MANUAL TRADES
# =========================================================
# Purpose: fallback strategy (rezervní konfigurace) pro manuální profese.
# Primární matrice (config.yaml) loví AI-native domény; tento soubor
# uchovává 14letý backstory (2010-2023) jako rezervu pro:
#   - B2B práce, přechodné finanční potřeby
#   - ověření trhu manuálních prací
# Přepnutí: python scripts/run_etl.py --config config_legacy_manual.yaml
# Sdílí stejný engine, portály a korelační cache s config.yaml.
#
# Kalibrace 2026-07-31 (semanticka_analyza_legacy_profil):
#   - blokace nemecko-spam trhu (bazos Praha = nemecke agentury)
#   - strechy: lokalitni filtr [praha]
#   - spravce_budov: rozsireni scope o facility/sprava
#   - elektrikar_prumysl: + elektrotechnik/elektro (pracecz trh)
#   - cnc_jobs: split obsluha/serizovani (programovani = AI-native cnc_cam)

user: "default"
profile: "LEGACY-MANUAL"

pipeline:
  max_workers: 3
  request_delay: 0.5

portals:
  jobs:
    enabled: true
    categories:
      - url: "https://www.jobs.cz/prace/praha/"
        pages: 20
      - url: "https://www.jobs.cz/prace/brno/"
        pages: 5

  bazos:
    enabled: true
    categories:
      - url: "https://prace.bazos.cz/"
        pages: 15
        params: {hlokalita: "18000", humkreis: "25"}
      - url: "https://prace.bazos.cz/brigada/"
        pages: 15
        params: {hlokalita: "18000", humkreis: "25"}

  pracecz:
    enabled: true
    categories:
      - url: "https://www.prace.cz/nabidky/hlavni-mesto-praha/praha/"
        pages: 25

  jenprace:
    enabled: true
    categories:
      - url: "https://www.jenprace.cz/nabidky/praha/"
        pages: 10
      - url: "https://www.jenprace.cz/brigady/praha/"
        pages: 5

  profesia:
    enabled: true
    categories:
      - url: "https://www.profesia.cz/prace/praha/"
        pages: 10

  volnamista:
    enabled: true
    categories:
      - url: "https://www.volnamista.cz/praha"
        pages: 10

  nyx:
    enabled: false
    categories: []

# ── Společný exclude pool (agentury / osobní inzeráty) ──
_x_exclude_common: &_x_exclude_common
  - agentura
  - poptavam
  - poptavame
  - shanim
  - hledam
  - do tymu
  - dodam
  - firmy
  - hledam praci
  - hledame kolegu
  - ico
  - jmenuji se
  - nabizim
  - nabizime
  - nabor
  - parta
  - provadim
  - provadime
  - prijmeme
  - prijima objednavky

# ── Blokace "práce v Německu" / ubytování / zprostředkování (bazos spam) ──
_x_exclude_nemecko: &_x_exclude_nemecko
  - nemecko
  - nemecku
  - fve
  - ubytovanim
  - ubytovani
  - zprostredkovani

queries:
  elektrikar_prumysl:
    boolean: "(elektrikar OR elektroinstalace OR autoelektrikar OR elektrotechnik OR elektro) AND (prumysl OR vyroba OR automatizace OR servis) NOT (kurz OR skoleni OR lektor)"
    exclude: [*_x_exclude_common, *_x_exclude_nemecko, "autoskola", "revize", "prodavame"]
    min_salary: 0
    locations: ["praha"]
    portals: ["bazos", "pracecz", "jobs", "jenprace", "profesia", "volnamista"]

  udrzbar:
    boolean: "(udrzbar OR udrzba OR udrzbarka OR maintenance OR (servisni AND technik)) NOT (it OR software OR web OR datovy OR klimatizace OR chlazeni OR tramvaj OR automechanik OR mechanik OR elektrik OR elektro OR semafor OR doprava)"
    exclude: [*_x_exclude_common, *_x_exclude_nemecko, "uklizec", "uklízeč", "uklid", "úklid", "ict", "laborator", "laboratoř", "it podpora"]
    min_salary: 0
    locations: ["praha"]
    portals: ["bazos", "pracecz", "jobs", "jenprace", "profesia", "volnamista"]

  spravce_budov:
    boolean: "((spravce OR správce OR facility OR sprava) AND (budov OR arealu OR objektu OR nemovitosti)) NOT (it OR system OR software OR linux OR network OR e-mail OR email OR informacnich OR informačních OR vyvojar OR vyvojář OR aplikaci OR systemu OR systemov OR dukovany)"
    exclude: [*_x_exclude_common, *_x_exclude_nemecko, "linux", "network", "e-mail", "email", "informacnich", "informačních", "vyvojar", "vyvojář", "aplikaci", "systemu", "systemov", "dukovany"]
    min_salary: 0
    locations: ["praha"]
    portals: ["bazos", "pracecz", "jenprace", "profesia", "volnamista"]

  zahradnik:
    boolean: "(zahradnik OR zahradník OR zahradni OR (sekani AND travy))"
    exclude: [*_x_exclude_common, *_x_exclude_nemecko, "uklizecka", "štěně", "steně", "stene", "kuchyn", "sklad", "restaurace", "nádobí", "nádobi"]
    min_salary: 0
    locations: []
    portals: ["bazos"]

  truhlar:
    boolean: "(truhlar OR truhlář OR stolar OR stolař)"
    exclude: [*_x_exclude_common, *_x_exclude_nemecko, "brikety", "odvoz", "palivove", "palivové", "prodavame", "prodám", "starozitne", "starožitné", "stary", "starý", "montér", "monter"]
    min_salary: 0
    locations: []
    portals: ["bazos"]

  strechy:
    boolean: "(strecha OR střecha OR pokryvac OR pokrývač OR okap OR krovy OR latovani OR krytina OR bitumen OR plech OR tondach OR betonova OR skridla)"
    exclude: [*_x_exclude_common, *_x_exclude_nemecko, "auto", "garaz", "garáž", "karoserie"]
    min_salary: 0
    locations: ["praha"]
    portals: ["bazos"]

  cnc_jobs:
    boolean: "((cnc AND (operator OR obsluha OR serizovac OR serizovani OR nastavovac OR obrabeni OR nastrojar OR nastroj)) OR (frezar AND (obsluha OR operator OR serizovani)) OR (obrabecich AND stroju)) NOT (cam OR sprutcam OR mastercam OR postprocesing OR programovani OR programator OR nabizim OR nabizime OR provadim OR provadime)"
    exclude: [*_x_exclude_common, *_x_exclude_nemecko, "personalni", "pronajem", "zprostredkovani", "ubytovn"]
    min_salary: 0
    locations: ["brno", "ostrava", "praha"]
    portals: ["bazos", "pracecz", "jenprace", "profesia", "volnamista"]
