# MCP-Jobs fallback configuration — LEGACY / MANUAL TRADES
# =========================================================
# Purpose: fallback strategy (rezervní konfigurace) pro manuální profese.
# Primární matrice (config.yaml) loví AI-native domény; tento soubor
# uchovává 14letý backstory (2010-2023) jako rezervu pro:
#   - B2B práce, přechodné finanční potřeby
#   - ověření trhu manuálních prací
# Přepnutí: python scripts/run_etl.py --config config_legacy_manual.yaml
# Sdílí stejný engine, portály a korelační cache s config.yaml.

user: "default"

portals:
  jobs:
    enabled: true
    categories:
      - url: "https://www.jobs.cz/prace/praha/"
        pages: 5
      - url: "https://www.jobs.cz/prace/brno/"
        pages: 2

  bazos:
    enabled: true
    categories:
      - url: "https://prace.bazos.cz/"
        pages: 15
        params: {hlokalita: "18000", humkreis: "25"}
      - url: "https://prace.bazos.cz/brigada/"
        pages: 15
        params: {hlokalita: "18000", humkreis: "25"}

  pracecz:
    enabled: true
    categories:
      - url: "https://www.prace.cz/nabidky/hlavni-mesto-praha/praha/"
        pages: 10

  nyx:
    enabled: false
    categories: []

queries:
  elektrikar_prumysl:
    boolean: "(elektrikar OR elektroinstalace OR autoelektrikar) AND (prumysl OR vyroba OR automatizace OR servis)"
    exclude: ["agentura", "poptavam", "poptavame", "shanim", "hledam", "autoskola", "do tymu", "dodam", "firmy", "hledam praci", "hledame kolegu", "ico", "jmenuji se", "nabizim", "nabizime", "nabor", "parta", "prodavame", "provadim", "provadime", "prijmeme", "prijima objednavky", "revize"]
    min_salary: 0
    locations: ["praha"]
    portals: ["bazos", "pracecz", "jobs"]

  udrzbar:
    boolean: "(udrzbar OR udrzba OR udrzbarka OR maintenance OR (servisni AND technik)) NOT (it OR software OR web OR datovy)"
    exclude: ["agentura", "poptavam", "poptavame", "shanim", "hledam", "do tymu", "dodam", "firmy", "hledam praci", "hledame kolegu", "ico", "jmenuji se", "nabizim", "nabizime", "nabor", "parta", "provadim", "provadime", "prijmeme", "prijima objednavky", "uklizec", "uklízeč", "uklid", "úklid", "ict", "laborator", "laboratoř", "it podpora"]
    min_salary: 0
    locations: ["praha"]
    portals: ["bazos", "pracecz", "jobs"]

  spravce_budov:
    boolean: "(spravce OR správce) AND (budov OR arealu OR objektu OR nemovitosti) NOT (it OR system OR software)"
    exclude: ["agentura", "poptavam", "poptavame", "shanim", "hledam", "do tymu", "dodam", "firmy", "hledam praci", "hledame kolegu", "ico", "jmenuji se", "nabizim", "nabizime", "nabor", "parta", "provadim", "provadime", "prijmeme", "prijima objednavky", "linux", "network", "e-mail", "email", "informacnich", "informačních", "vyvojar", "vyvojář", "aplikaci", "systemu", "systemov", "dukovany"]
    min_salary: 0
    locations: ["praha"]
    portals: ["bazos", "pracecz"]

  zahradnik:
    boolean: "(zahradnik OR zahradník OR zahradni OR (sekani AND travy))"
    exclude: ["agentura", "do tymu", "dodam", "firmy", "hledam praci", "hledame kolegu", "ico", "jmenuji se", "nabizim", "nabizime", "nabor", "parta", "provadim", "provadime", "prijmeme", "prijima objednavky", "uklizecka", "štěně", "steně", "stene", "kuchyn", "sklad", "restaurace", "nádobí", "nádobi"]
    min_salary: 0
    locations: []
    portals: ["bazos"]

  truhlar:
    boolean: "(truhlar OR truhlář OR stolar OR stolař)"
    exclude: ["agentura", "brikety", "do tymu", "dodam", "firmy", "hledam praci", "hledame kolegu", "ico", "jmenuji se", "nabizim", "nabizime", "nabor", "odvoz", "palivove", "palivové", "parta", "prodavame", "prodám", "provadim", "provadime", "prijmeme", "prijima objednavky", "starozitne", "starožitné", "stary", "starý", "montér", "monter"]
    min_salary: 0
    locations: []
    portals: ["bazos"]

  strechy:
    boolean: "(strecha OR střecha OR pokryvac OR pokrývač OR okap)"
    exclude: ["agentura", "auto", "do tymu", "dodam", "firmy", "garaz", "garáž", "hledam praci", "hledame kolegu", "ico", "jmenuji se", "karoserie", "nabizim", "nabizime", "nabor", "parta", "provadim", "provadime", "prijmeme", "prijima objednavky"]
    min_salary: 0
    locations: []
    portals: ["bazos"]

  cnc_jobs:
    boolean: "(cnc OR frezar OR programovani OR serizovani) NOT (nabizim OR nabizime OR provadim OR provadime)"
    exclude: ["agentura", "poptavam", "poptavame", "shanim", "hledam", "do tymu", "dodam", "firmy", "hledam praci", "hledame kolegu", "ico", "jmenuji se", "nabizim", "nabizime", "nabor", "parta", "personalni", "pronajem", "provadim", "provadime", "prijmeme", "prijima objednavky", "ubytovn", "zprostredkovani"]
    min_salary: 0
    locations: ["brno", "ostrava", "praha"]
    portals: ["bazos", "pracecz"]
