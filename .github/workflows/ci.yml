name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcpjobs
          POSTGRES_PASSWORD: mcpjobs
          POSTGRES_DB: mcpjobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcpjobs -d mcpjobs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mcpjobs:mcpjobs@localhost:5432/mcpjobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ scripts/healthcheck.py
      - name: Test
        run: pytest -q